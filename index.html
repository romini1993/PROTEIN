<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calc Protein Pro v3</title>
    <link rel="manifest" href="manifest-protein.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 400px; padding: 20px; background: var(--card); border-radius: 22px; border: 1px solid #334155; height: fit-content; align-self: center; }
        h2 { text-align: center; color: var(--accent); margin: 0 0 18px 0; font-size: 22px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--subtext); font-size: 12px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: var(--bg); border: 2px solid #334155; border-radius: 12px; font-size: 17px; color: white; font-weight: bold; outline: none; }
        input:focus { border-color: var(--accent); }
        .result-card { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; padding: 15px; border-radius: 18px; text-align: center; margin-top: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .total-val { font-size: 40px; font-weight: bold; display: block; line-height: 1; margin: 5px 0; }
        .unit { font-size: 12px; text-transform: uppercase; opacity: 0.9; font-weight: bold; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
        .btn { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-share { background: #22c55e; color: white; }
        .btn-reset { background: #ef4444; color: white; }
        .footer { text-align: center; margin-top: 18px; font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; }
        
        /* Style baru buat Histori */
        .history-section { margin-top: 20px; border-top: 1px solid #334155; padding-top: 10px; }
        .history-toggle { width: 100%; background: none; border: none; color: var(--accent); font-weight: bold; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .history-content { display: none; padding: 10px 0; max-height: 300px; overflow-y: auto; }
        .history-item { background: var(--bg); padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; border-left: 3px solid var(--accent); }
        .history-date { font-weight: bold; color: var(--accent); margin-bottom: 5px; display: block; }
        .btn-history-share { background: #0ea5e9; color: white; width: 100%; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🍗 Calc Protein Pro</h2>
    <div class="input-group"><label>Dada Ayam (Gram)</label><input type="number" id="ayam" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Telur (Butir)</label><input type="number" id="telur" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Tempe (Gram)</label><input type="number" id="tempe" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Tahu (Gram)</label><input type="number" id="tahu" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Ikan Kembung (Gram)</label><input type="number" id="kembung" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Ikan Tongkol (Gram)</label><input type="number" id="tongkol" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="input-group"><label>Daging Sapi (Gram)</label><input type="number" id="sapi" inputmode="decimal" placeholder="0" oninput="hitung()"></div>
    <div class="result-card">
        <span class="unit">Total Asupan Protein</span>
        <span class="total-val" id="total">0</span>
        <span class="unit">gram</span>
    </div>
    <div class="action-btns">
        <button class="btn btn-reset" onclick="resetForm()">🔄 Reset</button>
        <button class="btn btn-share" onclick="shareData()">📤 Kirim</button>
    </div>

    <div class="history-section">
        <button class="history-toggle" onclick="toggleHistory()">📜 LIHAT HISTORI <span id="arrow">▼</span></button>
        <div id="historyContent" class="history-content">
            <button class="btn btn-history-share" onclick="shareHistory()">📤 Kirim Semua Histori</button>
            <div id="historyList"></div>
        </div>
    </div>

    <p class="footer">PROTEIN TRACKER • GACOR EDITION</p>
</div>
<script>
    window.onload = function() {
        const saved = JSON.parse(localStorage.getItem('protein_data_v3'));
        if (saved) {
            document.getElementById('ayam').value = saved.ayam || "";
            document.getElementById('telur').value = saved.telur || "";
            document.getElementById('tempe').value = saved.tempe || "";
            document.getElementById('tahu').value = saved.tahu || "";
            document.getElementById('kembung').value = saved.kembung || "";
            document.getElementById('tongkol').value = saved.tongkol || "";
            document.getElementById('sapi').value = saved.sapi || "";
            hitung();
        }
        renderHistory();
    }
    function hitung() {
        const getVal = (id) => parseFloat(document.getElementById(id).value) || 0;
        const a = getVal('ayam'), b = getVal('telur'), c = getVal('tempe'), d = getVal('tahu'), e = getVal('kembung'), f = getVal('tongkol'), g = getVal('sapi');
        const totalP = (a * 0.31) + (b * 6) + (c * 0.19) + (d * 0.08) + (e * 0.22) + (f * 0.24) + (g * 0.24);
        document.getElementById('total').innerText = totalP.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
        const data = { ayam: a, telur: b, tempe: c, tahu: d, kembung: e, tongkol: f, sapi: g };
        localStorage.setItem('protein_data_v3', JSON.stringify(data));
    }
    function resetForm() {
        if(confirm("Reset semua?")) {
            document.querySelectorAll('input').forEach(i => i.value = "");
            document.getElementById('total').innerText = "0";
            localStorage.removeItem('protein_data_v3');
        }
    }
    function shareData() {
        const getV = (id) => document.getElementById(id).value || 0;
        const total = document.getElementById('total').innerText;
        const sekarang = new Date();
        const tglFull = sekarang.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const tglSimpel = sekarang.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const wkt = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
        
        let rincian = "";
        if(getV('ayam') > 0) rincian += `• Dada Ayam: ${getV('ayam')}g\n`;
        if(getV('telur') > 0) rincian += `• Telur: ${getV('telur')} butir\n`;
        if(getV('tempe') > 0) rincian += `• Tempe: ${getV('tempe')}g\n`;
        if(getV('tahu') > 0) rincian += `• Tahu: ${getV('tahu')}g\n`;
        if(getV('kembung') > 0) rincian += `• Ikan Kembung: ${getV('kembung')}g\n`;
        if(getV('tongkol') > 0) rincian += `• Ikan Tongkol: ${getV('tongkol')}g\n`;
        if(getV('sapi') > 0) rincian += `• Daging Sapi: ${getV('sapi')}g\n`;
        
        if (rincian === "") return alert("Isi dulu bro datanya!");

        const teks = `🍗 *LAPORAN ASUPAN PROTEIN* 🍗\n📅 _${tglFull} | ${wkt} WIB_\n\n${rincian}\n*Total Protein: ${total} gram*\n\nData sudah tercatat sesuai timbangan.`;
        
        // Simpan ke Histori
        saveToHistory(tglSimpel, rincian, total);
        
        window.open(`https://wa.me/?text=${encodeURIComponent(teks)}`, '_blank');
    }

    // FUNGSI HISTORI
    function saveToHistory(tgl, rincian, total) {
        let history = JSON.parse(localStorage.getItem('protein_history')) || [];
        const newItem = { tgl, rincian, total, timestamp: new Date().getTime() };
        history.unshift(newItem); // Tambah ke paling atas
        if(history.length > 30) history.pop(); // Batasin 30 data biar gak berat
        localStorage.setItem('protein_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('protein_history')) || [];
        const list = document.getElementById('historyList');
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span class="history-date">${item.tgl}</span>
                ${item.rincian.replace(/\n/g, '<br>')}
                <strong>Total: ${item.total}g</strong>
            </div>
        `).join('');
    }

    function toggleHistory() {
        const content = document.getElementById('historyContent');
        const arrow = document.getElementById('arrow');
        if (content.style.display === "block") {
            content.style.display = "none";
            arrow.innerText = "▼";
        } else {
            content.style.display = "block";
            arrow.innerText = "▲";
        }
    }

    function shareHistory() {
        const history = JSON.parse(localStorage.getItem('protein_history')) || [];
        if (history.length === 0) return alert("Belum ada histori bro!");
        
        let teks = "📜 *HISTORI ASUPAN PROTEIN* 📜\n\n";
        history.forEach(item => {
            teks += `${item.tgl}\n${item.rincian}Total: ${item.total}g\n\n`;
        });
        
        window.open(`https://wa.me/?text=${encodeURIComponent(teks)}`, '_blank');
    }
</script>
</body>
</html>
